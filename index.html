<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="data:;base64,=" />
</head>
<body>

    <!-- Top-centered navigation -->
    <nav class="top-nav" aria-label="Navegação principal">
        <div class="nav-inner">
            <a href="index.html" class="brand-badge" aria-label="Taylor Swift logo">
                <img src="img/tsLogo.png" alt="TS logo" width="28" height="28" style="display:block; border-radius:6px; object-fit:cover;" />
            </a>

            <ul class="nav-list" role="menubar">
                <li role="none"><a role="menuitem" href="index.html" class="nav-item active"><span class="material-icons nav-icon" aria-hidden="true">home</span></a></li>
                <li role="none"><a role="menuitem" href="calculadoraHora.html" class="nav-item"><span class="material-icons nav-icon" aria-hidden="true">calculate</span><span class="nav-label">Calculadora</span></a></li>
            </ul>
        </div>
    </nav>

    <main class="home">
        <div class="home-container">
            <section class="hero-card" role="region" aria-label="Seção principal">
                <div class="hero-left">
                    <img class="hero-logo" src="img/tsLogo.png" alt="TS" width="64" height="64" />
                    <h1 class="hero-title">Bem-vinda, meu amor ❤️</h1>
                    <p class="hero-sub">Pequenos gestos que aquecem o dia — uma dedicatória só para você.</p>

                    <div id="loveMessage" class="love-message" aria-live="polite"></div>

                    <div class="hero-actions">
                        <a class="btn btn-primary" href="calculadoraHora.html">Abrir Calculadora</a>
                    </div>
                </div>

                <aside class="hero-right" id="playlist" aria-label="Player de músicas">
                    <div class="spotify-wrap">
                        <iframe class="spotify-iframe" src="https://open.spotify.com/embed/playlist/6QaO3ULIMwRXdPuPkphBss?utm_source=generator&theme=0" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                        <iframe class="spotify-iframe-small" src="https://open.spotify.com/embed/track/0ug5NqcwcFR2xrfTkc7k8e?utm_source=generator&theme=0" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                    </div>
                </aside>
            </section>

            <footer class="home-footer">Pequenas surpresas, grandes memórias — feito com carinho. Te amo muito, Janice ❤️ - Com amor, seu nerd!</footer>
        </div>
    </main>

    <script>
    (function(){
        const messages = [
            'Te amo além das palavras.',
            'Cada dia com você é meu favorito.',
            'Você é minha canção preferida.',
            'Meu amor por você cresce todos os dias.',
            'Você faz meu coração sorrir.',
            'Com você, tudo é melhor.',
            'Você é meu lar e meu lar é você.',
            'Te amo hoje e sempre.',
            'Você é meu sol em qualquer dia nublado.',
            'Amar você é fácil — e real.'
        ];
        try {
            const el = document.getElementById('loveMessage');
            if (!el) return;
            const idx = Math.floor(Math.random() * messages.length);
            el.textContent = messages[idx];
        } catch (e) { /* ignore */ }
    })();
    </script>

</body>
</html>

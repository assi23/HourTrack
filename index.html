<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="data:;base64,=" />
</head>
<body>

    <!-- Top-centered navigation -->
    <nav class="top-nav" aria-label="Navegação principal">
        <div class="nav-inner">
            <a href="index.html" class="brand-badge" aria-label="Taylor Swift logo">
                <img src="img/tsLogo.png" alt="TS logo" width="28" height="28" style="display:block; border-radius:6px; object-fit:cover;" />
            </a>

            <ul class="nav-list" role="menubar">
                <li role="none"><a role="menuitem" href="index.html" class="nav-item active"><span class="material-icons nav-icon" aria-hidden="true">home</span><span class="nav-label">Casa</span></a></li>
                <li role="none"><a role="menuitem" href="calculadoraHora.html" class="nav-item"><span class="material-icons nav-icon" aria-hidden="true">calculate</span><span class="nav-label">Calculadora</span></a></li>
            </ul>
        </div>
    </nav>

    <main style="padding:120px 24px; text-align:center;">
        <h1>Bem-vinda meu amor ❤️</h1>
        <div id="loveMessage" style="font-size:1.25rem;color:#b80f6b;margin:12px 0 18px;font-weight:700;"></div>
        <div style="margin-bottom:6px;color:#6b2b4a;">Para alegrar seu dia</div>

        <div style="max-width:900px;margin:0 auto 18px;">
            <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/6QaO3ULIMwRXdPuPkphBss?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>

        <div style="margin-bottom:6px;color:#6b2b4a;">Nossa música</div>
        <div>
            <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/0ug5NqcwcFR2xrfTkc7k8e?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </main>

    <script>
    (function(){
        const messages = [
            'Te amo além das palavras.',
            'Cada dia com você é meu favorito.',
            'Você é minha canção preferida.',
            'Meu amor por você cresce todos os dias.',
            'Você faz meu coração sorrir.',
            'Com você, tudo é melhor.',
            'Você é meu lar e meu lar é você.',
            'Te amo hoje e sempre.',
            'Você é meu sol em qualquer dia nublado.',
            'Amar você é fácil — e real.'
        ];
        try {
            const el = document.getElementById('loveMessage');
            if (!el) return;
            const idx = Math.floor(Math.random() * messages.length);
            el.textContent = messages[idx];
        } catch (e) { /* ignore */ }
    })();
    </script>

</body>
</html>

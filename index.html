<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Hours Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Work Hours Calculator</h1>

        <div class="form-group">
            <label>Total Work Hours Per Day</label>
            <input type="time" id="dailyHours" value="08:00">
        </div>

        <div class="form-group">
            <label>Lunch Break Duration</label>
            <input type="time" id="lunchTime" value="01:00">
        </div>

        <hr>

        <h2>Worked Period</h2>

        <div class="form-group">
            <label>Start Work</label>
            <input type="time" id="startWork">
        </div>

        <div class="form-group">
            <label>Lunch Start</label>
            <input type="time" id="lunchStart">
        </div>

        <div class="form-group">
            <label>Lunch End</label>
            <input type="time" id="lunchEnd">
        </div>

        <div class="form-group">
            <label>Current Time / Return to Work</label>
            <input type="time" id="returnWork">
        </div>

        <div class="form-group">
            <label>Optional Extra Hours</label>
            <input type="time" id="extraHours" value="00:00">
        </div>

        <button id="calculateBtn">Calculate Exit Time</button>

        <div class="result">
            <h3>Expected Exit Time</h3>
            <p id="result">--:--</p>
        </div>
    </div>
    
    <script src="jspdf.umd.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
